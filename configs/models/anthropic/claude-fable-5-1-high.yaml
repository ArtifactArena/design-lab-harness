# Claude Fable 5.1 — Anthropic model id `claude-fable-5-1`.
model: anthropic/claude-fable-5-1
temperature: 1.0
max_tokens: 128000  # Anthropic native max_output_tokens (same cap as Fable 5)
# Native Anthropic effort (provider-managed budget), identical shape to the
# claude-fable-5-high config. Fable has thinking always-on and takes no
# `thinking` param; depth is controlled purely via output_config.effort.
output_config:
  effort: high
