# ARH — AutoResearch harness run: the roster models (configs/models/run-roster-2026-09.yaml),
# 50 full-feedback commits per build, BUILD PHASE ONLY.
# One process per lineage; scripts/arh_launch.sh runs every model 5 times with
#   --iterations 1 --build-only --output-dir <root>/<model>/c<N>
# Selection and finals happen downstream on the same env (same inactivity rule).
# Run with: scripts/arh_launch.sh [N_LINEAGES] [MAX_PARALLEL]

base: base.yaml

llms:
  - configs/models/anthropic/claude-fable-5-1-high.yaml
  - configs/models/anthropic/claude-fable-5-high.yaml
  - configs/models/anthropic/claude-opus-5-high.yaml
  - configs/models/anthropic/claude-sonnet-5-high.yaml
  - configs/models/anthropic/claude-opus-4-7-high.yaml
  - configs/models/anthropic/claude-opus-4-8-high.yaml
  - configs/models/openai/gpt-6-astra.yaml
  - configs/models/openai/gpt-5.6-luna.yaml
  - configs/models/openai/gpt-5.6-sol.yaml
  - configs/models/openai/gpt-5.6-terra.yaml
  - configs/models/openai/gpt-5.5.yaml
  - configs/models/openai/gpt-5.4.yaml
  - configs/models/openai/gpt-5.3-codex-high.yaml
  - configs/models/google/gemini-3-1-pro-high.yaml
  - configs/models/google/gemini-3-8-flash-high.yaml
  - configs/models/xai/grok-4.6-high.yaml
  - configs/models/xai/grok-4.5-high.yaml
  - configs/models/xai/grok-4.20-reasoning.yaml
  - configs/models/deepseek/deepseek-v4-pro-thinking.yaml
  - configs/models/kimi/kimi-k3-high.yaml
  - configs/models/minimax/minimax-m3-high.yaml
  - configs/models/qwen/qwen3.8-2.4t-a95b-thinking.yaml
  - configs/models/zai/glm-5.3-high.yaml
  - configs/models/zai/glm-5.2-high.yaml

season:
  env: PROD
  season_id: arh
  tournament_id: arh
  iterations: 1
  output_dir: LOGS-ARH/{date}/{tournament_id}

models_as_engineers:
  unified_generation: true
  zero_shot_mode: false
  commit_budget: 50
  # The run's one design brief: rules, MJCF syntax and obs schema in one document.
  autoresearch_prompt_path: configs/rules/autoresearch_prompt.md
  use_dspy_cache: false
  n_parallel_builds: 1

output:
  verbose: true
  debug_all: true
  dump_prompt: true          # keep every request + response: refinement/commit_N/prompt.txt
